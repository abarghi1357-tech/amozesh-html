<style>
    .subscribe-button {
background-color: rgb(200, 0, 0);
color: white;
border: none;
height: 36px;
width: 100px;
border-radius: 5px;
cursor: pointer;
margin-right: 8px;
    }
    .join-button{
        background-color: white;
        border-color: rgb(3, 158, 224);
        border-style: solid;
        border-width: 1px;
        color: rgb(3, 158, 224);
        height: 36px;
        width: 80px;
        border-radius: 2px;
        cursor: pointer;
    }
.tweet-button{
    background-color: rgb(0, 178, 254);
    color: white;
    border: none;
    height: 36px;
    width: 70px;
    font-weight: bold;
font-size: 15px;
border-radius: 35px;
margin-left: 8px;
cursor: pointer;
transition: all;
direction: 3;
}
.tweet-button:hover {
    background-color: aquamarine;
}
  </style>
<button class="subscribe-button">
    SUBSCRIBE
</button>

<button class="join-button">
    JOIN
</button>   

<button class="tweet-button">
Tweet
</button>
